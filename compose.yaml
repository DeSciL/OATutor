name: oatutor

# Postgres for local work on the server. Port 5433, so it can run beside TutorCreator's.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oatutor
      POSTGRES_USER: oatutor
      POSTGRES_PASSWORD: oatutor
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db:
